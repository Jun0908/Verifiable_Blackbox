[platformio]
default_envs = m5stick-c-plus2

[env:m5stick-c-plus2]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29

[env:m5stick-c-plus2-signature]
extends = env:m5stick-c-plus2
build_flags =
    ${env:m5stick-c-plus2.build_flags}
    -DDEVICE_SIGNATURE_ENABLED=1
