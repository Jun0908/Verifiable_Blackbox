[profile.default]
src = "contracts"
test = "test-solidity"
out = "out"
cache_path = "cache"
libs = ["../../lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../../lib/openzeppelin-contracts/contracts/", "forge-std/=../../lib/forge-std/src/"]
